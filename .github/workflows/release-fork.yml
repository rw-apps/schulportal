name: Release (Fork Schulportal)

# Baut bei jeder neuen Version in pubspec.yaml eine signierte APK und legt
# Tag + GitHub-Release an.
# Obtainium auf den Familien-/Freundes-Handys erkennt das Release und bietet
# das Update an; die App selbst prüft dieselben Releases (lib/utils/whats_new.dart,
# forkReleasesApiUrl in lib/fork_identity.dart).
#
# Tag-Format ist „v<version>+<build>“, abgeleitet aus pubspec.yaml „version:“.
# Ursache: compareVersions() in whats_new.dart zerlegt den Tag an „.“ und „+“
# in Zahlen; ein abweichendes Format (z. B. „v4.1.0-rw1“) wirft beim int.parse.
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   base64 der Datei schulportal-release.jks
#   KEYSTORE_PASSWORD Passwort (store = key, Alias „schulportal“)
# Ohne Secrets bricht der Lauf ab, statt eine unsignierte/fremd signierte APK
# zu veröffentlichen — Android lehnt Updates mit anderem Schlüssel ab, die
# Nutzer müssten sonst neu installieren und verlören ihre Anmeldung.

on:
  # Release = Versionssprung in pubspec.yaml auf main.
  # Ursache: Tag-Pushes aus der Claude-Sitzung werden vom Git-Proxy abgewiesen
  # (HTTP 403, 14.10.26); Branch-Pushes gehen. Deshalb legt dieser Workflow den
  # Tag selbst an (gh release create … --target). Grenze: Ein Push ohne neue
  # Version baut nichts (Schritt „Version schon veröffentlicht?“).
  push:
    branches: [main]
    # Workflow-Datei selbst mit: Änderungen am Release-Weg laufen so sofort einmal
    # durch (bei unveränderter Version ohne Bau, s. „Version schon veröffentlicht?“).
    paths: [pubspec.yaml, .github/workflows/release-fork.yml]
  workflow_dispatch:

# Pflicht: Ohne contents:write darf github.token kein Release/Tag anlegen
# („HTTP 403: Resource not accessible by integration“ im Schritt „Release
# veröffentlichen“, Lauf 38635426767 vom 14.10.26 — der Block war beim Umbau
# auf Versionssprung-Auslösung versehentlich weggefallen).
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version schon veröffentlicht?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag existiert bereits – nichts zu tun."
            echo "neu=false" >> "$GITHUB_OUTPUT"
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Signierschlüssel bereitstellen
        if: steps.ver.outputs.neu == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret KEYSTORE_BASE64 fehlt"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=schulportal
          EOF

      - name: Codegen, Analyse, Tests
        if: steps.ver.outputs.neu == 'true'
        run: |
          flutter pub get
          dart run intl_utils:generate
          flutter analyze --no-fatal-infos
          flutter test

      # Je Prozessorart eine APK statt einer „fat“ APK (17.10.26): Die
      # gemeinsame APK trug App-Code, Flutter und Cronet dreifach (arm64,
      # armv7, x86_64) und wog 53 MB; arm64 allein 19,5 MB. x86_64 entfällt
      # (nur Emulatoren/Chromebooks). Grenze: --split-per-abi setzt den
      # versionCode auf 1000 × ABI + Build (armv7 10334, arm64 11334 bei
      # Build 9334). Eine spätere gemeinsame APK müsste darüber liegen, sonst
      # lehnt Android das Update ab. --split-debug-info verschiebt die
      # Debug-Symbole aus der APK; sie liegen als Lauf-Artefakt bei
      # (Absturzanalyse).
      - name: APKs bauen
        if: steps.ver.outputs.neu == 'true'
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --split-debug-info=build/symbols \
            --dart-define=cronetHttpNoPlay=true
          tag="${{ steps.ver.outputs.tag }}"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "schulportal-$tag-arm64-v8a.apk"
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "schulportal-$tag-armeabi-v7a.apk"
          ls -la schulportal-*.apk

      - name: Debug-Symbole sichern
        if: steps.ver.outputs.neu == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ steps.ver.outputs.tag }}
          path: build/symbols
          retention-days: 90

      # Nur der oberste Abschnitt des Änderungsprotokolls (diese Version),
      # nicht die ganze Datei wie bisher.
      - name: Notizen dieser Version
        if: steps.ver.outputs.neu == 'true'
        run: |
          awk 'BEGIN{n=0} /^\*\*[0-9]/{n++} n==1' CHANGELOG-FORK.md > notes.md
          test -s notes.md || cp CHANGELOG-FORK.md notes.md

      - name: Release veröffentlichen
        if: steps.ver.outputs.neu == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.ver.outputs.tag }}" schulportal-*.apk --target "$GITHUB_SHA" --title "Schulportal ${{ steps.ver.outputs.tag }}" --notes-file notes.md
